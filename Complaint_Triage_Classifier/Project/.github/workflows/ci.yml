name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      # The CPU-only torch wheel keeps the CI install near 200 MB instead of 2.5 GB.
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check src scripts tests

      - name: Test
        run: pytest

      # Proves the documented pipeline actually runs end to end on a clean
      # checkout, using the committed synthetic sample.
      - name: Smoke-test the pipeline on the synthetic sample
        run: |
          python scripts/01_prepare_data.py \
            --input data/raw/complaints_sample.csv \
            --output data/interim/complaints_clean.csv \
            --profile-output reports/metrics/clean_profile.json
          python scripts/02_bootstrap_labels.py \
            --input data/interim/complaints_clean.csv \
            --output data/labeled/bootstrap_labels.csv \
            --review-output data/labeled/manual_review_queue.csv \
            --sample-size 100
          python scripts/03_make_splits.py \
            --input data/labeled/bootstrap_labels.csv \
            --output-dir data/processed
          python scripts/04_train_baseline.py \
            --task triage \
            --output-dir models/baseline/triage
