name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install lint and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest boto3 pydantic

      - name: Lint
        run: ruff check .

      # Covers score normalization, score fusion, and password hashing. None of
      # these need the embedding model, so CI stays fast and offline.
      - name: Test
        run: pytest

      - name: Check that no secrets are tracked
        run: |
          if git ls-files | grep -E '(^|/)\.env$'; then
            echo "::error::A .env file is tracked. Remove it and rotate the credentials."
            exit 1
          fi
          echo "No .env files tracked."
