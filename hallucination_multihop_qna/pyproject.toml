[project]
name = "hallucination-resistant-multihop-qa"
version = "0.1.0"
description = "Evidence-grounded RAG pipeline for multi-hop question answering on HotpotQA."
readme = "README.md"
requires-python = ">=3.10"

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["notebooks", "scripts/hotpot_evaluate_v1.py"]

[tool.ruff.lint]
# Pinned explicitly so a new ruff release cannot change what CI enforces.
# E/W: pycodestyle, F: pyflakes, I: import sorting, UP: pyupgrade, B: bugbear.
select = ["E", "W", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Contains multi-line prompt templates. Re-wrapping a prompt changes the text
# the model receives, so line length is not enforced on prompt bodies.
"pipeline/prompt_builder.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
